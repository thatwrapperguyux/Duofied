<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Duofied · Fold Preview</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="8" height="15" rx="1.8"/><rect x="13.5" y="4.5" width="8" height="15" rx="1.8"/><path d="M12 3.2v17.6"/></svg>
        </span>
        <span class="brand-text"><strong>Duofied</strong><span>Fold preview</span></span>
        <a class="icon-button" href="https://github.com/jadon7/iphone-duo" target="_blank" rel="noopener noreferrer" aria-label="View project on GitHub" title="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"/></svg>
        </a>
      </header>

      <div class="panels">
        <section class="panel" data-panel="screens">
          <div class="panel-head"><h2>Screens</h2></div>
          <div class="segmented" role="tablist" aria-label="Screen UI type">
            <button role="tab" data-ui-theme="wallpaper" aria-selected="true" disabled>Wallpaper</button>
            <button role="tab" data-ui-theme="launcher" aria-selected="false" disabled>Launcher</button>
            <button role="tab" data-ui-theme="custom" aria-selected="false" disabled>Custom</button>
          </div>
          <div class="slots" id="custom-screens" role="group" aria-label="Custom screen images" hidden>
            <div class="slot" data-custom-screen="outer">
              <div class="slot-row">
                <button class="slot-pick" type="button" disabled>
                  <span class="slot-preview"></span>
                  <span class="slot-text"><span class="slot-title">Screen 1 · Closed</span><span class="slot-state">Add image</span></span>
                </button>
                <button class="slot-clear" type="button" aria-label="Remove the closed screen image" hidden disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
              </div>
              <div class="slot-transform" data-screen-transform="outer" hidden><label class="num"><span>W</span><input type="number" data-screen-field="width" min="10" max="400" step="1" value="100" aria-label="W of the closed screen image, percent" title="Use the arrow keys to adjust" disabled><i>%</i></label><label class="num"><span>H</span><input type="number" data-screen-field="height" min="10" max="400" step="1" value="100" aria-label="H of the closed screen image, percent" title="Use the arrow keys to adjust" disabled><i>%</i></label><label class="num"><span>X</span><input type="number" data-screen-field="x" min="-100" max="100" step="1" value="0" aria-label="X of the closed screen image, percent" title="Use the arrow keys to adjust" disabled><i>%</i></label><label class="num"><span>Y</span><input type="number" data-screen-field="y" min="-100" max="100" step="1" value="0" aria-label="Y of the closed screen image, percent" title="Use the arrow keys to adjust" disabled><i>%</i></label><button class="link" type="button" data-screen-reset="outer" disabled>Reset</button></div>
            </div>
            <div class="slot" data-custom-screen="inner">
              <div class="slot-row">
                <button class="slot-pick" type="button" disabled>
                  <span class="slot-preview"></span>
                  <span class="slot-text"><span class="slot-title">Screen 2 · Open</span><span class="slot-state">Add image</span></span>
                </button>
                <button class="slot-clear" type="button" aria-label="Remove the open screen image" hidden disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
              </div>
              <div class="slot-transform" data-screen-transform="inner" hidden><label class="num"><span>W</span><input type="number" data-screen-field="width" min="10" max="400" step="1" value="100" aria-label="W of the open screen image, percent" title="Use the arrow keys to adjust" disabled><i>%</i></label><label class="num"><span>H</span><input type="number" data-screen-field="height" min="10" max="400" step="1" value="100" aria-label="H of the open screen image, percent" title="Use the arrow keys to adjust" disabled><i>%</i></label><label class="num"><span>X</span><input type="number" data-screen-field="x" min="-100" max="100" step="1" value="0" aria-label="X of the open screen image, percent" title="Use the arrow keys to adjust" disabled><i>%</i></label><label class="num"><span>Y</span><input type="number" data-screen-field="y" min="-100" max="100" step="1" value="0" aria-label="Y of the open screen image, percent" title="Use the arrow keys to adjust" disabled><i>%</i></label><button class="link" type="button" data-screen-reset="inner" disabled>Reset</button></div>
            </div>
          </div>
          <input id="ui-upload" type="file" accept="image/*" hidden disabled>
        </section>

        <section class="panel" data-panel="background">
          <div class="panel-head"><h2>Background</h2></div>
          <div class="segmented" role="tablist" aria-label="Background type">
            <button role="tab" data-background-mode="color" aria-selected="true" disabled>Color</button>
            <button role="tab" data-background-mode="gradient" aria-selected="false" disabled>Gradient</button>
            <button role="tab" data-background-mode="image" aria-selected="false" disabled>Image</button>
            <button role="tab" data-background-mode="none" aria-selected="false" disabled>None</button>
          </div>
          <div class="background-fields" data-background-fields="color">
            <div class="swatches">
              <button class="swatch" type="button" data-background-color="#f6f6f3" style="--swatch:#f6f6f3" aria-label="Off white" disabled></button>
              <button class="swatch" type="button" data-background-color="#e6e9e0" style="--swatch:#e6e9e0" aria-label="Pale sage" disabled></button>
              <button class="swatch" type="button" data-background-color="#d9e2ef" style="--swatch:#d9e2ef" aria-label="Cool grey" disabled></button>
              <button class="swatch" type="button" data-background-color="#f2ded0" style="--swatch:#f2ded0" aria-label="Warm sand" disabled></button>
              <button class="swatch" type="button" data-background-color="#2b3128" style="--swatch:#2b3128" aria-label="Deep olive" disabled></button>
              <button class="swatch" type="button" data-background-color="#101418" style="--swatch:#101418" aria-label="Near black" disabled></button>
            </div>
            <label class="field"><span>Custom</span><input id="background-color" type="color" value="#f6f6f3" disabled></label>
          </div>
          <div class="background-fields" data-background-fields="gradient" hidden>
            <div class="field-row">
              <label class="field"><span>From</span><input id="gradient-from" type="color" value="#dfe7f5" disabled></label>
              <label class="field"><span>To</span><input id="gradient-to" type="color" value="#f7e6d8" disabled></label>
            </div>
            <label class="field"><span>Angle</span><input id="gradient-angle" type="range" min="0" max="360" step="5" value="160" disabled></label>
          </div>
          <div class="background-fields" data-background-fields="image" hidden>
            <div class="slots">
              <div class="slot" data-background-slot>
                <div class="slot-row">
                  <button class="slot-pick" type="button" disabled>
                    <span class="slot-preview"></span>
                    <span class="slot-text"><span class="slot-title">Backdrop</span><span class="slot-state">Add image</span></span>
                  </button>
                  <button class="slot-clear" type="button" aria-label="Remove the background image" hidden disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
                </div>
              </div>
            </div>
          </div>
          <input id="background-upload" type="file" accept="image/*" hidden disabled>
        </section>

        <section class="panel" data-panel="device">
          <div class="panel-head"><h2>Device</h2><button class="link" id="device-reset" type="button" disabled>Reset</button></div>
          <label class="field"><span>Size</span><input id="device-scale" type="range" min="20" max="300" step="1" value="100" disabled><span class="field-value" id="device-scale-value">100%</span></label>
          <label class="field"><span>X</span><input id="rotate-x" type="range" min="-180" max="180" step="1" value="0" aria-label="Rotate around X" disabled><span class="field-value" id="rotate-x-value">0°</span></label>
          <label class="field"><span>Y</span><input id="rotate-y" type="range" min="-180" max="180" step="1" value="0" aria-label="Rotate around Y" disabled><span class="field-value" id="rotate-y-value">0°</span></label>
          <label class="field"><span>Z</span><input id="rotate-z" type="range" min="-180" max="180" step="1" value="0" aria-label="Rotate around Z" disabled><span class="field-value" id="rotate-z-value">0°</span></label>
          <p class="note">Rotation in degrees. Drag the preview to orbit the camera.</p>
        </section>

        <section class="panel" data-panel="frame">
          <div class="panel-head"><h2>Frame</h2></div>
          <div class="segmented" role="tablist" aria-label="Frame shape">
            <button role="tab" data-aspect="fit" aria-selected="true" disabled>Fit</button>
            <button role="tab" data-aspect="16:9" aria-selected="false" disabled>16:9</button>
            <button role="tab" data-aspect="1:1" aria-selected="false" disabled>1:1</button>
            <button role="tab" data-aspect="9:16" aria-selected="false" disabled>9:16</button>
          </div>
          <p class="note" id="frame-size">&mdash;</p>
        </section>

        <section class="panel" data-panel="fold">
          <div class="panel-head"><h2>Fold</h2><span class="readout" id="angle-readout">180°</span></div>
          <div class="fold-row">
            <button id="play" class="icon-button" aria-label="Play animation" title="Play animation" disabled>
              <svg id="pause-icon" viewBox="0 0 24 24" hidden><path d="M9 6v12M15 6v12"/></svg>
              <svg id="play-icon" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7Z"/></svg>
            </button>
            <input id="angle" aria-label="Fold progress" type="range" min="0" max="180" value="180" step="0.1" disabled>
          </div>
          <div class="presets">
            <button type="button" data-fold="0" disabled>Closed</button>
            <button type="button" data-fold="90" disabled>Half</button>
            <button type="button" data-fold="180" disabled>Open</button>
          </div>
        </section>
      </div>

      <footer class="sidebar-foot">
        <div class="actions">
          <button id="record" class="button primary" aria-label="Record the fold animation" disabled>
            <span class="record-dot" aria-hidden="true"></span><span id="record-label">Record MP4</span>
          </button>
          <button id="snapshot" class="button ghost" aria-label="Save the current frame as a PNG" title="Save the current frame as a PNG" disabled>PNG</button>
        </div>
        <p class="hint">Captures one full fold cycle.</p>
      </footer>
    </aside>

    <main class="stage">
      <div class="frame">
        <div id="viewport" aria-label="iPhone Duo 3D model. Drag to rotate, scroll to zoom."></div>
      </div>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
